[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-native-air-quality-pipeline"
version = "1.0.0"
description = "Scheduled, idempotent PM2.5 forecasting pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "pandas==2.3.3",
  "numpy==2.4.6",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "torch==2.5.1",
  "streamlit==1.66.1",
  "plotly==6.9.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "httpx==0.28.1", "pre-commit>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]