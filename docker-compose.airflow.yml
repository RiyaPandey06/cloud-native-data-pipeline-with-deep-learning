# Optional: run the same pipeline under Airflow, for DAG screenshots.
#
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up --build db airflow
#
# Start only `db` and `airflow` (not `scheduler`), or two writers will ingest the same data.
# The UI is at http://localhost:8080; `airflow standalone` prints the generated admin password.
services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/air_quality
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: standalone
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./artifacts:/opt/project/artifacts
