services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: air_quality
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d air_quality"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/air_quality
    command: uvicorn air_quality_pipeline.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./artifacts:/app/artifacts

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/air_quality
    command: python scripts/scheduler.py
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts

  trainer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/air_quality
    command: python scripts/retrain_scheduler.py
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/air_quality
    command: streamlit run src/air_quality_pipeline/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  postgres_data:
